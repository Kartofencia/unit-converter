<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Unit Converter</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <nav>
                <ul class="nav-bars">
                    <li><a href="length.html">Length</a></li>
                    <li><a href="weight.html">Weight</a></li>
                    <li><a href="temperature.html">Temperature</a></li>
                </ul>
            </nav>
        </header>

        <section class="main-conv">
            <form id="main-form">
                <input 
                    type="number"
                    placeholder="Enter a number"
                    required
                    name="main-value"
                    id="main-value">
                <select required name="main-inp-unit">
                    <option value="" selected disabled hidden>Input</option>
                    <option value="m">m</option>
                    <option value="km">km</option>
                    <option value="cm">cm</option>
                    <option value="in">in</option>
                    <option value="ft">ft</option>
                    <option value="mi">mi</option>
                </select>
                <select style="margin-left:0px;" required name="main-out-unit">
                    <option value="" selected disabled hidden>Output</option>
                    <option value="m">m</option>
                    <option value="km">km</option>
                    <option value="cm">cm</option>
                    <option value="in">in</option>
                    <option value="ft">ft</option>
                    <option value="mi">mi</option>
                </select>
                <button id="main-conv-btn" type="submit">Convert</button>
            </form>
            <label>Result will appear here</label>
        </section>

        <section class="imp-conv">
            <form id="imp-form">
                <input
                    type="text"
                    placeholder="Enter multiple numbers with units (e.g. '12m 34in 56mi')"
                    required
                    name="imp-value"
                    id="imp-value">
                <select style="margin-top:15px; text-align:center;" required name="imp-out-unit">
                    <option value="" selected disabled hidden>Select Output Unit</option>
                    <option value="m">m</option>
                    <option value="km">km</option>
                    <option value="cm">cm</option>
                    <option value="in">in</option>
                    <option value="ft">ft</option>
                    <option value="mi">mi</option>
                </select>
                <button id="imp-conv-btn" type="submit">Convert</button>
            </form>
            <label>Result will appear here</label>
        </section>
        
    </body>

</html>
